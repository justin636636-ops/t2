<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#55546D" stroke="none" stroke-width="3"/><text x="64" y="69" text-anchor="start" fill="#F5E8CD" font-size="36" font-family="Hiragino Sans GB, sans-serif">商店 · 弹芯盒与成长</text><text x="1534" y="67" text-anchor="end" fill="#F5E8CD" font-size="27" font-family="Hiragino Sans GB, sans-serif">金币 9 · 下一关：铁皮船长</text><rect x="46" y="111" width="881" height="678" rx="12" fill="#F5E8CD" stroke="#302C3F" stroke-width="3"/><text x="80" y="158" text-anchor="start" fill="#302C3F" font-size="30" font-family="Hiragino Sans GB, sans-serif">五枚装填芯</text><text x="887" y="158" text-anchor="end" fill="#302C3F" font-size="24" font-family="Hiragino Sans GB, sans-serif">按 1 → 5 发射</text><rect x="81" y="192" width="143" height="177" rx="10" fill="#EEE1C5" stroke="#302C3F" stroke-width="3"/><text x="152" y="233" text-anchor="middle" fill="#302C3F" font-size="27" font-family="Hiragino Sans GB, sans-serif">1  粘胶</text><text x="152" y="272" text-anchor="middle" fill="#302C3F" font-size="24" font-family="Hiragino Sans GB, sans-serif">芯 #01</text><text x="152" y="317" text-anchor="middle" fill="#302C3F" font-size="22" font-family="Hiragino Sans GB, sans-serif">固定一只</text><text x="152" y="349" text-anchor="middle" fill="#302C3F" font-size="19" font-family="Hiragino Sans GB, sans-serif">本局保留</text><rect x="247" y="192" width="143" height="177" rx="10" fill="#EEE1C5" stroke="#302C3F" stroke-width="3"/><text x="318" y="233" text-anchor="middle" fill="#302C3F" font-size="27" font-family="Hiragino Sans GB, sans-serif">2  粘胶</text><text x="318" y="272" text-anchor="middle" fill="#302C3F" font-size="24" font-family="Hiragino Sans GB, sans-serif">芯 #02</text><text x="318" y="317" text-anchor="middle" fill="#302C3F" font-size="22" font-family="Hiragino Sans GB, sans-serif">连线准备</text><text x="318" y="349" text-anchor="middle" fill="#302C3F" font-size="19" font-family="Hiragino Sans GB, sans-serif">本局保留</text><rect x="413" y="192" width="143" height="177" rx="10" fill="#EEE1C5" stroke="#302C3F" stroke-width="3"/><text x="484" y="233" text-anchor="middle" fill="#302C3F" font-size="27" font-family="Hiragino Sans GB, sans-serif">3  弹簧</text><text x="484" y="272" text-anchor="middle" fill="#302C3F" font-size="24" font-family="Hiragino Sans GB, sans-serif">芯 #03</text><text x="484" y="317" text-anchor="middle" fill="#302C3F" font-size="22" font-family="Hiragino Sans GB, sans-serif">向上弹起</text><text x="484" y="349" text-anchor="middle" fill="#302C3F" font-size="19" font-family="Hiragino Sans GB, sans-serif">本局保留</text><rect x="579" y="192" width="143" height="177" rx="10" fill="#EEE1C5" stroke="#302C3F" stroke-width="3"/><text x="650" y="233" text-anchor="middle" fill="#302C3F" font-size="27" font-family="Hiragino Sans GB, sans-serif">4  钢针</text><text x="650" y="272" text-anchor="middle" fill="#302C3F" font-size="24" font-family="Hiragino Sans GB, sans-serif">芯 #04</text><text x="650" y="317" text-anchor="middle" fill="#302C3F" font-size="22" font-family="Hiragino Sans GB, sans-serif">穿盾收割</text><text x="650" y="349" text-anchor="middle" fill="#302C3F" font-size="19" font-family="Hiragino Sans GB, sans-serif">本局保留</text><rect x="745" y="192" width="143" height="177" rx="10" fill="#F0D47E" stroke="#302C3F" stroke-width="3"/><text x="816" y="233" text-anchor="middle" fill="#302C3F" font-size="27" font-family="Hiragino Sans GB, sans-serif">5  裂壳</text><text x="816" y="272" text-anchor="middle" fill="#302C3F" font-size="24" font-family="Hiragino Sans GB, sans-serif">芯 #05</text><text x="816" y="317" text-anchor="middle" fill="#302C3F" font-size="22" font-family="Hiragino Sans GB, sans-serif">产生碎弹</text><text x="816" y="349" text-anchor="middle" fill="#302C3F" font-size="19" font-family="Hiragino Sans GB, sans-serif">本局保留</text><text x="81" y="420" text-anchor="start" fill="#302C3F" font-size="28" font-family="Hiragino Sans GB, sans-serif">备用弹芯  2 / 3</text><rect x="81" y="444" width="220" height="112" rx="9" fill="#F5E8CD" stroke="#302C3F" stroke-width="3"/><text x="191" y="486" text-anchor="middle" fill="#302C3F" font-size="26" font-family="Hiragino Sans GB, sans-serif">学徒 #06</text><text x="191" y="525" text-anchor="middle" fill="#302C3F" font-size="22" font-family="Hiragino Sans GB, sans-serif">熟练 2 / 3</text><rect x="327" y="444" width="220" height="112" rx="9" fill="#F5E8CD" stroke="#302C3F" stroke-width="3"/><text x="437" y="486" text-anchor="middle" fill="#302C3F" font-size="26" font-family="Hiragino Sans GB, sans-serif">票券 #07</text><text x="437" y="525" text-anchor="middle" fill="#302C3F" font-size="22" font-family="Hiragino Sans GB, sans-serif">本关未兑奖</text><rect x="573" y="444" width="220" height="112" rx="9" fill="#F5E8CD" stroke="#302C3F" stroke-width="3"/><text x="683" y="486" text-anchor="middle" fill="#302C3F" font-size="26" font-family="Hiragino Sans GB, sans-serif">空位</text><text x="683" y="525" text-anchor="middle" fill="#302C3F" font-size="22" font-family="Hiragino Sans GB, sans-serif">可存一枚</text><text x="81" y="607" text-anchor="start" fill="#302C3F" font-size="28" font-family="Hiragino Sans GB, sans-serif">选择芯 #05 喂养幼龙</text><text x="81" y="650" text-anchor="start" fill="#302C3F" font-size="25" font-family="Hiragino Sans GB, sans-serif">提交后：第 5 位裂壳芯移除，自动补普通芯</text><text x="81" y="693" text-anchor="start" fill="#302C3F" font-size="23" font-family="Hiragino Sans GB, sans-serif">当前仍在预览，取消保留原芯与经验</text><text x="81" y="754" text-anchor="start" fill="#302C3F" font-size="23" font-family="Hiragino Sans GB, sans-serif">拖拽或选中后左右移动 · 组内开枪后锁定</text><rect x="963" y="111" width="591" height="407" rx="12" fill="#F5E8CD" stroke="#302C3F" stroke-width="3"/><text x="1000" y="160" text-anchor="start" fill="#302C3F" font-size="32" font-family="Hiragino Sans GB, sans-serif">纸壳幼龙</text><text x="1000" y="215" text-anchor="start" fill="#302C3F" font-size="25" font-family="Hiragino Sans GB, sans-serif">当前：营养 0 · 尚无末发能力</text><text x="1000" y="265" text-anchor="start" fill="#302C3F" font-size="26" font-family="Hiragino Sans GB, sans-serif">投入：永久喂掉裂壳芯 #05</text><text x="1000" y="315" text-anchor="start" fill="#302C3F" font-size="28" font-family="Hiragino Sans GB, sans-serif">预览：营养 0 → 1 · 到 1 级</text><text x="1000" y="363" text-anchor="start" fill="#302C3F" font-size="25" font-family="Hiragino Sans GB, sans-serif">后续组末发收割会推开一只邻靶</text><rect x="1000" y="417" width="212" height="62" rx="8" fill="#F0D47E" stroke="#302C3F" stroke-width="3"/><text x="1106" y="457" text-anchor="middle" fill="#302C3F" font-size="27" font-family="Hiragino Sans GB, sans-serif">确认喂养</text><rect x="1251" y="417" width="260" height="62" rx="8" fill="#F5E8CD" stroke="#302C3F" stroke-width="3"/><text x="1381" y="457" text-anchor="middle" fill="#302C3F" font-size="25" font-family="Hiragino Sans GB, sans-serif">取消并保留弹芯</text><rect x="963" y="548" width="591" height="241" rx="12" fill="#F5E8CD" stroke="#302C3F" stroke-width="3"/><text x="1000" y="590" text-anchor="start" fill="#302C3F" font-size="28" font-family="Hiragino Sans GB, sans-serif">发条鸭 · 储能 1 / 3</text><text x="1000" y="636" text-anchor="start" fill="#302C3F" font-size="25" font-family="Hiragino Sans GB, sans-serif">射击中主动交出 2 个未射弹位</text><text x="1000" y="677" text-anchor="start" fill="#302C3F" font-size="25" font-family="Hiragino Sans GB, sans-serif">可到一级；能力从下一组生效</text><text x="1000" y="723" text-anchor="start" fill="#302C3F" font-size="24" font-family="Hiragino Sans GB, sans-serif">成本：放弃当前两发，仍须达标</text><text x="1000" y="762" text-anchor="start" fill="#302C3F" font-size="21" font-family="Hiragino Sans GB, sans-serif">此处为条件说明，尚未提交成长</text><text x="800" y="853" text-anchor="middle" fill="#F5E8CD" font-size="26" font-family="Hiragino Sans GB, sans-serif">预览移除、资源和能力变化后再提交；同枚芯不会同时保留与被喂养</text></svg>